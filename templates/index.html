<!DOCTYPE html>
<html>

<head>
    <title>My Grocery Shop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}?v=999">
</head>

<body>

    <header>
        <!-- <img src="/static/images/oil.webp" alt="Logo" width="50" height="50"> -->
        <h1>Fresh Grocery Store</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/choose-login">Login</a>
            <a href="/signup">Signup</a>
        </nav>
    </header>

    <section class="hero">
        <h2>Fresh Groceries Delivered To Your Door</h2>
        <p>Buy Online or Pick From Store</p>
    </section>

    <form method="GET" action="/">
        <input type="text" name="q" placeholder="Search for products..." value="{{ request.args.get('q', '') }}">
        <button type="submit">Search</button>
    </form>

    <section class="products">

        {% for product in products %}
        <div class="card">
            <img src="/static/images/{{ product.image }}" alt="{{ product.name }}" width="150" height="150">
            <h3>{{ product.name }}</h3>
            <p>₹{{ product.price }}</p>

            {% if product.stock != '0' %}
            <a href="/add-to-cart/{{ product.id }}" class="btn">Add to Cart</a>
            {% else %}
            <span class="out">Out of Stock</span>
            {% endif %}
        </div>
        {% endfor %}

    </section>

</body>

</html>
